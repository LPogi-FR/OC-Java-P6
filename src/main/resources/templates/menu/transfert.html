<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Pay My Buddy Application</title>
    <link href="../../static/style/main.css" rel="stylesheet" data-th-href="@{/style/main.css}"/>
    <script th:src="@{/resources/static/js/script.js}"></script>
</head>
<body>

<h1> Transfert</h1>

<div>
    <nav class="main-nav" aria-label="Main menu">
        PAY MY BUDDY
        <ul id="navigation">

            <div class="top-nav"><a class="nav-link" href="index">Pay My Buddy</a></div>

            <li class="nav-item"><a class="nav-link" href="home">Home</a>
            <li class="nav-item"><a class="nav-link" href="transfert">Add Relation</a>
            <li class="nav-item"><a class="nav-link" href="profile">Profile</a>
            <li class="nav-item"><a class="nav-link" href="contact">Contact</a>
            <li class="nav-item"><a class="nav-link" href="logout">Log Out</a>

        </ul>

    </nav>

</div>
<div align="center">
    <div  align="center" class="form">
        <h1> Add receiver</h1>
        <form method="post" th:action="@{/transfert/newreceiver}" th:object="${receiverForm}">
            <label> Add receiver</label>
            <select th:field="*{email}" >
                <option th:each="receiver:${otherSenders}" th:value="${receiver.email}" th:text="${receiver.name}"></option>
            </select>
            <br>
            <input type="submit" value="Add Relation">
            <br>
        </form>

    </div>

</div>

</body>
</html>
